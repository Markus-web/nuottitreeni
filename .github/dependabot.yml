# Weekly updates, but only for releases at least 14 days old (cooldown): new versions get
# time to be pulled or fixed upstream before they reach this project.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      build-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      browser-tests:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
