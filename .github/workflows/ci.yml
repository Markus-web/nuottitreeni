# Tests, build, a dry-run deploy and the browser suite (flows, WCAG 2.2 AAA matrix, SEO crawl,
# Lighthouse budgets, deploy-button defaults) on every push and pull request.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Unit and Worker tests
        run: npm test

      - name: Build (size budgets)
        run: npm run build

      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install browser test packages
        run: npm ci --prefix tests/browser --ignore-scripts

      - name: Browser suite
        run: node tests/browser/run.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-artifacts
          path: tests/browser/artifacts/
          retention-days: 14
