name: Translation
description: Offer a new language or report a translation problem.
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - I want to translate the app into a new language
        - A text is wrong or unclear in an existing language
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a fix, give the page and the current text. For a new language, see docs/translations.md.
